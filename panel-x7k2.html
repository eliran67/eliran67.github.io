<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>לוח בקרה — בורקס עמקה</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --coffee:#2E1B12; --coffee-2:#3D2317; --crust:#E8A33D; --crust-light:#F4C468;
    --terracotta:#C9532B; --cream:#FBF3E7; --cream-2:#F3E6D2; --ink:#2A1A10; --line:rgba(46,27,18,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Heebo',sans-serif; background:var(--cream); color:var(--ink); min-height:100vh;}
  h1,h2,.display{font-family:'Rubik',sans-serif;}

  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:linear-gradient(180deg,var(--coffee-2),var(--coffee) 70%);
  }
  .login-box{
    background:#fff; border-radius:20px; padding:30px 26px; width:100%; max-width:340px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3); text-align:center;
  }
  .login-box .flame{font-size:34px; margin-bottom:8px;}
  .login-box h1{font-size:19px; color:var(--coffee-2); margin-bottom:4px;}
  .login-box p{font-size:12.5px; color:#8a7461; margin-bottom:20px;}
  .login-box input{
    width:100%; padding:13px; border-radius:12px; border:1.5px solid var(--line);
    font-size:16px; text-align:center; letter-spacing:2px; margin-bottom:12px; font-family:inherit;
  }
  .login-box button{
    width:100%; padding:13px; border-radius:12px; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--crust),var(--terracotta)); color:#fff;
    font-weight:800; font-size:14.5px;
  }
  .login-error{color:var(--terracotta); font-size:12.5px; margin-top:10px; min-height:16px;}

  header.admin{
    background:var(--coffee); color:var(--cream); padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10;
  }
  header.admin .title{font-weight:800; font-size:16px; display:flex; align-items:center; gap:8px;}
  header.admin button{
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:var(--cream);
    padding:7px 12px; border-radius:10px; font-size:12px; cursor:pointer;
  }

  main{padding:16px; max-width:640px; margin:0 auto;}
  .view-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .view-tab{
    flex:1; padding:10px; border-radius:12px; border:1.5px solid var(--line); background:#fff; cursor:pointer;
    font-family:inherit; font-size:13.5px; font-weight:700; color:var(--ink);
  }
  .view-tab.active{background:var(--coffee); color:#fff; border-color:var(--coffee);}
  .cols[data-view="orders"] .col-stats, .cols[data-view="stats"] .col-orders{display:none;}
  @media (min-width:900px){
    main{max-width:1120px;}
    .view-tabs{display:none;}
    .cols{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:20px; align-items:start;}
    .cols[data-view] .col-orders, .cols[data-view] .col-stats{display:block;}
    .col-stats{position:sticky; top:76px; max-height:calc(100vh - 92px); overflow-y:auto;}
  }
  .toolbar{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto;}
  .filter-chip{
    white-space:nowrap; padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:600;
    border:1.5px solid var(--line); background:#fff; cursor:pointer; color:var(--ink);
  }
  .filter-chip.active{background:var(--coffee); color:#fff; border-color:var(--coffee);}

  .empty{text-align:center; padding:60px 20px; color:#8a7461; font-size:13.5px;}

  .order-card{
    background:#fff; border-radius:16px; padding:16px; margin-bottom:12px; border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(46,27,18,0.06);
  }
  .order-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .order-num{font-weight:800; color:var(--terracotta); font-size:14.5px;}
  .order-time{font-size:11.5px; color:#8a7461; margin-top:2px;}
  .status-badge{
    font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px; white-space:nowrap;
  }
  .status-חדשה{background:#FEE2C4; color:#8a5a12;}
  .status-בטיפול{background:#DCEAFB; color:#1c5b9e;}
  .status-מוכנה{background:#E1EFDA; color:#3c6b2f;}
  .status-הושלמה{background:#E7E1F5; color:#5a3fa0;}
  .status-בוטלה{background:#EEE; color:#666;}

  .email-alert{
    background:#FDECEA; color:#8c1d18; border:1px solid #f3b8b3; border-radius:12px;
    padding:10px 12px; font-size:12.5px; line-height:1.6; margin-bottom:14px;
  }
  .email-alert:empty{display:none;}
  .email-alert code{direction:ltr; unicode-bidi:embed; font-size:11.5px; word-break:break-word;}
  .order-cust a{color:var(--terracotta); font-weight:700;}

  .order-items{font-size:13px; color:#4a382c; line-height:1.8; margin-bottom:10px;}
  .order-cust{
    font-size:12.5px; color:#6b5644; background:var(--cream); border-radius:10px; padding:10px 12px;
    line-height:1.8; margin-bottom:12px;
  }
  .order-total{font-weight:800; color:var(--coffee-2); font-size:14px; margin-bottom:12px;}
  .status-select{
    width:100%; padding:9px; border-radius:10px; border:1.5px solid var(--line);
    font-family:inherit; font-size:13px; background:#fff;
  }

  .delete-btn{
    display:block; margin:10px auto 0; background:none; color:#a0533a; font-size:12px; font-weight:600;
    padding:4px 8px; border-radius:8px;
  }
  .delete-btn:hover{background:#fbe9e2;}
  .del-overlay{position:fixed; inset:0; background:rgba(46,27,18,.45); display:flex; align-items:center; justify-content:center; z-index:60; padding:16px;}
  .del-overlay[hidden]{display:none;}
  .del-box{background:#fff; border-radius:16px; padding:18px; width:100%; max-width:340px; box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .del-box h2{font-size:16px; color:var(--coffee-2); margin-bottom:6px;}
  .del-box p{font-size:12.5px; color:#6b5644; line-height:1.6; margin-bottom:12px;}
  .del-box input{width:100%; padding:10px; border-radius:10px; border:1.5px solid var(--line); font-family:inherit; font-size:14px;}
  .del-box .del-err{color:var(--terracotta); font-size:12.5px; min-height:18px; margin-top:6px;}
  .del-box .del-actions{display:flex; gap:8px; margin-top:8px;}
  .del-box .del-actions button{flex:1; padding:10px; border-radius:10px; font-family:inherit; font-size:13.5px; font-weight:700;}
  .del-box .del-confirm{background:#b5442a; color:#fff;}
  .del-box .del-confirm:disabled{opacity:.6;}
  .del-box .del-cancel{background:var(--cream); color:var(--coffee-2);}

  .refresh-note{text-align:center; font-size:11.5px; color:#8a7461; margin-top:14px;}

  .backup-alert{
    background:#FFF4DC; color:#7a5200; border:1px solid #f0d28a; border-radius:12px;
    padding:10px 12px; font-size:12.5px; line-height:1.6; margin-bottom:14px;
  }
  .backup-alert:empty{display:none;}
  .stats-card{
    background:#fff; border-radius:16px; padding:14px 16px; margin-bottom:14px; border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(46,27,18,0.06);
  }
  .stats-card h2{font-size:14px; color:var(--coffee-2); margin-bottom:10px;}
  .stats-tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stats-tile{background:var(--cream); border-radius:12px; padding:10px 12px;}
  .stats-tile .label{font-size:11.5px; color:#8a7461;}
  .stats-tile .value{font-family:'Rubik',sans-serif; font-weight:800; font-size:22px; color:var(--coffee-2); line-height:1.3;}
  .stats-tile .delta{font-size:11.5px; color:#6b5644;}
  .stats-tile .delta.up{color:#3c6b2f;} .stats-tile .delta.down{color:#a8431f;}
  .stats-card details{margin-top:12px; font-size:12.5px;}
  .stats-card summary{cursor:pointer; color:var(--terracotta); font-weight:700; padding:4px 0;}
  .stats-table{width:100%; border-collapse:collapse; margin-top:8px; font-size:12.5px;}
  .stats-table th,.stats-table td{padding:6px 4px; text-align:right; border-bottom:1px solid var(--line);}
  .stats-table th{color:#8a7461; font-weight:600; font-size:11.5px;}
  .stats-table td.num,.stats-table th.num{text-align:left; font-variant-numeric:tabular-nums;}
  .bar-row{display:flex; align-items:center; gap:8px; padding:3px 0; font-size:12.5px;}
  .bar-label{flex:0 0 52px; color:#6b5644;}
  .bar-track{flex:1; height:10px; background:var(--cream-2); border-radius:999px; overflow:hidden;}
  .bar-fill{display:block; height:100%; background:var(--crust); border-radius:999px;}
  .bar-row.wide .bar-num{flex-basis:88px;}
  .bar-num{flex:0 0 28px; text-align:left; font-variant-numeric:tabular-nums; color:var(--coffee-2); font-weight:600;}
  .stats-sub{font-weight:700; color:var(--coffee-2); margin:14px 0 2px;}
  .stats-note{color:#8a7461; font-size:11.5px; line-height:1.6; margin-top:10px;}
  .backup-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:12.5px; color:#6b5644;}
  .backup-row button{
    white-space:nowrap; padding:8px 12px; border-radius:10px; border:1.5px solid var(--line); background:#fff;
    font-family:inherit; font-size:12.5px; font-weight:700; color:var(--coffee-2); cursor:pointer;
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="flame">🔥</div>
    <h1>לוח בקרה — בורקס עמקה</h1>
    <p>הזן את סיסמת הניהול כדי לצפות בהזמנות</p>
    <input type="password" id="pwInput" placeholder="••••••" autocomplete="off">
    <button onclick="login()">כניסה</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="dashboard" style="display:none;">
  <header class="admin">
    <div class="title">🔥 הזמנות נכנסות</div>
    <div style="display:flex; gap:8px;">
      <a href="panel-x7k2-stock.html" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:var(--cream); padding:7px 12px; border-radius:10px; font-size:12px; text-decoration:none;">📦 מלאי</a>
      <button onclick="logout()">יציאה</button>
    </div>
  </header>
  <main>
    <div class="email-alert" id="emailAlert" role="alert"></div>
    <div class="backup-alert" id="backupAlert" role="status"></div>
    <!-- בטלפון: שתי לשוניות. במסך רחב: שתי עמודות זו לצד זו, והלשוניות מוסתרות -->
    <div class="view-tabs" role="tablist">
      <button type="button" class="view-tab" id="tabOrders" role="tab" onclick="setView('orders')">🔥 הזמנות</button>
      <button type="button" class="view-tab" id="tabStats" role="tab" onclick="setView('stats')">📊 המספרים</button>
    </div>
    <div class="cols" id="cols" data-view="orders">
      <div class="col-orders">
        <div class="toolbar" id="toolbar"></div>
        <div id="ordersList"></div>
        <div class="refresh-note">מתעדכן אוטומטית כל 30 שניות · <a href="#" onclick="loadOrders(); return false;" style="color:var(--terracotta); font-weight:700;">רענן עכשיו</a></div>
      </div>
      <div class="col-stats">
        <section class="stats-card" id="statsCard" hidden></section>
      </div>
    </div>
  </main>
</div>

<div class="del-overlay" id="delOverlay" hidden onclick="if(event.target === this) closeDelete()">
  <div class="del-box" role="dialog" aria-modal="true" aria-labelledby="delTitle">
    <h2 id="delTitle">למחוק את ההזמנה?</h2>
    <p>ההזמנה והפרטים שלה יימחקו לגמרי, ואי אפשר לבטל. <b>המלאי לא ישתנה.</b><br>כדי לאשר, הזן את הקוד של לוח הבקרה:</p>
    <input type="password" id="delPw" placeholder="••••••" autocomplete="off"
      onkeydown="if(event.key === 'Enter') confirmDelete(); if(event.key === 'Escape') closeDelete();">
    <div class="del-err" id="delErr" role="alert"></div>
    <div class="del-actions">
      <button type="button" class="del-confirm" id="delConfirm" onclick="confirmDelete()">מחיקה</button>
      <button type="button" class="del-cancel" onclick="closeDelete()">ביטול</button>
    </div>
  </div>
</div>

<script>
// ===== עדכן כאן לכתובת ה-Worker שלך אחרי הפריסה ל-Cloudflare =====
const API_URL = 'https://api.burekas-amka.co.il';

let STATUSES = ['חדשה','בטיפול','מוכנה','הושלמה','בוטלה']; // מתעדכן מהשרת
const SOURCE_ICONS = { 'אתר':'🌐', 'טלפון':'📞', 'וואטסאפ':'💬', 'אינסטגרם':'📸', 'במקום':'🏪' };
let currentFilter = 'הכל';
let allOrders = [];
let pollTimer = null;
let knownOrderIds = null; // כדי לזהות הזמנות חדשות ולהשמיע צליל

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// צליל קצר כשנכנסת הזמנה חדשה (עובד אחרי שהייתה לחיצה בדף, למשל כפתור הכניסה)
function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.25, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.2);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
    });
  } catch(e){}
}

function getToken(){ return localStorage.getItem('borekas_admin_token'); }
function setToken(t){ localStorage.setItem('borekas_admin_token', t); }
function clearToken(){ localStorage.removeItem('borekas_admin_token'); }

async function login(){
  const pw = document.getElementById('pwInput').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!pw){ errEl.textContent = 'הזן סיסמה'; return; }

  try{
    const res = await fetch(API_URL + '/api/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error || 'שגיאה בהתחברות'; return; }
    setToken(data.token);
    showDashboard();
  } catch(e){
    errEl.textContent = 'שגיאת רשת — בדוק שכתובת ה-API הוגדרה נכון';
  }
}

function logout(){
  clearToken();
  if(pollTimer) clearInterval(pollTimer);
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function showDashboard(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  setView(localStorage.getItem('borekas_admin_view') === 'stats' ? 'stats' : 'orders');
  renderToolbar();
  loadOrders();
  loadStats();
  pollTimer = setInterval(loadOrders, 30000);
}

// בטלפון מוצגת לשונית אחת בכל פעם (הזמנות או המספרים); במסך רחב שתיהן מוצגות כעמודות
function setView(view){
  document.getElementById('cols').dataset.view = view;
  document.getElementById('tabOrders').classList.toggle('active', view === 'orders');
  document.getElementById('tabStats').classList.toggle('active', view === 'stats');
  try{ localStorage.setItem('borekas_admin_view', view); } catch(e){}
}

function renderToolbar(){
  const bar = document.getElementById('toolbar');
  const filters = ['הכל', ...STATUSES];
  bar.innerHTML = filters.map(f =>
    `<button class="filter-chip ${f===currentFilter?'active':''}" onclick="setFilter('${f}')">${f}</button>`
  ).join('');
}

function setFilter(f){
  currentFilter = f;
  renderToolbar();
  renderOrders();
}

async function loadOrders(){
  const token = getToken();
  if(!token){ logout(); return; }

  try{
    const res = await fetch(API_URL + '/api/admin/orders', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if(res.status === 401){ logout(); return; }
    const data = await res.json();
    allOrders = data.orders || [];
    if(data.statuses){ STATUSES = data.statuses; renderToolbar(); }

    const ids = new Set(allOrders.map(o => o.id));
    if(knownOrderIds && allOrders.some(o => !knownOrderIds.has(o.id))){ beep(); }
    knownOrderIds = ids;
    const newCount = allOrders.filter(o => o.status === 'חדשה').length;
    document.title = (newCount ? `(${newCount}) ` : '') + 'לוח בקרה — בורקס עמקה';

    renderEmailAlert(data.lastEmail);
    renderOrders();
  } catch(e){
    // שקט - ננסה שוב בפעם הבאה
  }
}

function renderEmailAlert(lastEmail){
  const el = document.getElementById('emailAlert');
  if(!lastEmail || lastEmail.ok){ el.innerHTML = ''; return; }
  const when = new Date(lastEmail.at).toLocaleString('he-IL', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'});
  el.innerHTML = `⚠️ המייל על הזמנה #${esc(lastEmail.orderNum)} (${when}) לא נשלח. ההזמנה עצמה נשמרה כאן.<br>
    הסיבה מ-EmailJS: <code>${esc(lastEmail.error)}</code>`;
}

function renderOrders(){
  const list = document.getElementById('ordersList');
  const filtered = currentFilter === 'הכל' ? allOrders : allOrders.filter(o => o.status === currentFilter);

  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">אין הזמנות להצגה כרגע</div>';
    return;
  }

  list.innerHTML = filtered.map(o => {
    const time = new Date(o.createdAt).toLocaleString('he-IL', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'});
    let itemsHtml = o.items.map(it => `${esc(it.name)} × ${it.qty} — ${it.qty * it.price} ₪`).join('<br>');
    if(o.comboCount > 0) itemsHtml += `<br>מבצע × ${o.comboCount} — -${o.discount} ₪`;
    const phoneDigits = String(o.customer.phone || '').replace(/[^\d+]/g, '');
    // מאיפה ההזמנה: "אתר", או מקור שנבחר בהזמנה ידנית בבוט הטלגרם
    const source = o.source || 'אתר';
    const sourceLabel = `${SOURCE_ICONS[source] || ''} ${esc(source)}`;
    // הזמנה ידנית יכולה להישמר בלי שם ובלי טלפון; רק בהזמנה מהאתר זה אומר שהפרטים נמחקו אחרי שנה
    const hasCustomer = o.customer.phone || o.customer.name || o.customer.notes;
    const custHtml = o.customer.phone
      ? `👤 ${esc(o.customer.name || 'לא צוין')} · 📞 <a href="tel:${esc(phoneDigits)}">${esc(o.customer.phone)}</a>`
      : `👤 ${esc(o.customer.name || 'לא צוין')}`;

    return `
    <div class="order-card">
      <div class="order-top">
        <div>
          <div class="order-num">#${esc(o.orderNum)}</div>
          <div class="order-time">${time} · ${sourceLabel}</div>
        </div>
        <div class="status-badge status-${esc(o.status)}">${esc(o.status)}</div>
      </div>
      <div class="order-items">${itemsHtml}</div>
      <div class="order-cust">
        ${hasCustomer || source !== 'אתר'
          ? `${custHtml}${o.customer.notes ? '<br>📝 ' + esc(o.customer.notes) : ''}`
          : '🔒 פרטי הלקוח נמחקו (הזמנה מלפני יותר משנה)'}
      </div>
      <div class="order-total">סה״כ: ${o.total} ₪</div>
      <select class="status-select" onchange="updateStatus('${o.id}', this.value)">
        ${STATUSES.map(s => `<option value="${s}" ${s===o.status?'selected':''}>${s}</option>`).join('')}
      </select>
      <button type="button" class="delete-btn" onclick="openDelete('${esc(o.id)}', '${esc(o.orderNum)}')">🗑 מחיקת הזמנה</button>
    </div>`;
  }).join('');
}

// הודעה קצרה על מה שקרה במלאי אחרי שינוי סטטוס ("הושלמה" מוריד מהמלאי, ביטול שלו מחזיר)
function showStockNote(stock){
  if(!stock) return;
  let msg = '';
  if(stock.deducted) msg = `📦 ירד מהמלאי (${stock.deducted} פריטים)`;
  else if(stock.restored) msg = `📦 הוחזר למלאי (${stock.restored} פריטים)`;
  else if(stock.skipped === 'no-inventory') msg = '📦 המלאי עוד לא הופעל - כדי שהזמנות יורידו ממנו, היכנס פעם אחת לאפליקציית המלאי';
  else if(stock.error) msg = '⚠️ הסטטוס עודכן, אבל עדכון המלאי נכשל. נסה לשנות שוב';
  showNote(msg);
}

// הודעה קצרה בתחתית המסך
function showNote(msg){
  if(!msg) return;
  let el = document.getElementById('stockNote');
  if(!el){
    el = document.createElement('div'); el.id = 'stockNote'; el.setAttribute('role','status');
    el.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2E1B12;color:#FBF3E7;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:50;max-width:92vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)';
    document.body.appendChild(el);
  }
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(el._t); el._t = setTimeout(() => { el.style.display = 'none'; }, 3500);
}

async function updateStatus(id, status){
  const token = getToken();
  try{
    const res = await fetch(API_URL + '/api/admin/orders/' + id, {
      method:'PATCH',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer ' + token},
      body: JSON.stringify({ status })
    });
    const data = await res.json().catch(() => ({}));
    showStockNote(data.stock);
    loadOrders();
    loadStats();
  } catch(e){
    alert('עדכון הסטטוס נכשל, נסה שוב');
  }
}

/* ===== מחיקת הזמנה: רק עם סיסמת הניהול, ובלי לגעת במלאי ===== */
let deleteTarget = null;

function openDelete(id, orderNum){
  deleteTarget = id;
  document.getElementById('delTitle').textContent = `למחוק את הזמנה #${orderNum}?`;
  document.getElementById('delPw').value = '';
  document.getElementById('delErr').textContent = '';
  document.getElementById('delConfirm').disabled = false;
  document.getElementById('delOverlay').hidden = false;
  document.getElementById('delPw').focus();
}

function closeDelete(){
  deleteTarget = null;
  document.getElementById('delOverlay').hidden = true;
}

async function confirmDelete(){
  const pw = document.getElementById('delPw').value;
  const errEl = document.getElementById('delErr');
  const btn = document.getElementById('delConfirm');
  if(!pw){ errEl.textContent = 'צריך להזין את הקוד'; return; }
  btn.disabled = true; errEl.textContent = '';
  try{
    const res = await fetch(API_URL + '/api/admin/orders/' + encodeURIComponent(deleteTarget) + '/delete', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer ' + getToken()},
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json().catch(() => ({}));
    if(res.status === 401){ closeDelete(); logout(); return; }
    if(res.status === 404){ closeDelete(); showNote('ההזמנה כבר נמחקה'); loadOrders(); loadStats(); return; }
    if(!res.ok){ errEl.textContent = data.error || 'המחיקה נכשלה, נסה שוב'; btn.disabled = false; return; }
    closeDelete();
    showNote('🗑 ההזמנה נמחקה. המלאי לא השתנה');
    loadOrders();
    loadStats();
  } catch(e){
    errEl.textContent = 'שגיאת רשת, נסה שוב'; btn.disabled = false;
  }
}

/* ===== המספרים: סיכום שבועי + גיבוי ===== */
const BACKUP_WARN_DAYS = 10; // הגיבוי האוטומטי רץ פעם בשבוע; אחרי 10 ימים בלי גיבוי מציגים תזכורת

function weekLabel(ymd){
  const [y, m, d] = ymd.split('-').map(Number);
  const end = new Date(Date.UTC(y, m - 1, d + 6));
  return `${d}.${m}–${end.getUTCDate()}.${end.getUTCMonth() + 1}`;
}

function deltaHtml(now, prev, unit){
  if(now === prev) return `<div class="delta">כמו בשבוע שעבר</div>`;
  const diff = now - prev;
  return `<div class="delta ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${Math.abs(diff)}${unit} מול שבוע שעבר (${prev}${unit})</div>`;
}

async function loadStats(){
  const token = getToken();
  if(!token) return;
  try{
    const res = await fetch(API_URL + '/api/admin/stats', { headers: { 'Authorization': 'Bearer ' + token } });
    if(!res.ok) return; // שרת ישן בלי המספרים, או כניסה שפגה - פשוט לא מציגים
    renderStats(await res.json());
  } catch(e){}
}

function renderStats(data){
  const weeks = data.weeks || [];
  const card = document.getElementById('statsCard');
  if(!weeks.length){ card.hidden = true; return; }
  const cur = weeks[0], prev = weeks[1] || { orders: 0, revenue: 0 };

  const sold = {}; let combos = 0;
  weeks.slice(0, 4).forEach(w => {
    combos += w.combos || 0;
    Object.entries(w.items || {}).forEach(([name, qty]) => { sold[name] = (sold[name] || 0) + qty; });
  });
  const soldRows = Object.entries(sold).sort((a, b) => b[1] - a[1])
    .map(([name, qty]) => `<tr><td>${esc(name)}</td><td class="num">${qty}</td></tr>`).join('');

  const wasOpen = !!(card.querySelector('details') && card.querySelector('details').open);
  card.hidden = false;
  card.innerHTML = `
    <h2>📊 המספרים · השבוע (${weekLabel(cur.week)})</h2>
    <div class="stats-tiles">
      <div class="stats-tile"><div class="label">הזמנות</div><div class="value">${cur.orders}</div>${deltaHtml(cur.orders, prev.orders, '')}</div>
      <div class="stats-tile"><div class="label">מכירות</div><div class="value">${cur.revenue} ₪</div>${deltaHtml(cur.revenue, prev.revenue, ' ₪')}</div>
    </div>
    <details ${wasOpen ? 'open' : ''}>
      <summary>8 השבועות האחרונים ומה נמכר</summary>
      <table class="stats-table">
        <tr><th>שבוע</th><th class="num">הזמנות</th><th class="num">מכירות</th><th class="num">בוטלו</th></tr>
        ${weeks.map(w => `<tr><td>${weekLabel(w.week)}</td><td class="num">${w.orders}</td><td class="num">${w.revenue} ₪</td><td class="num">${w.cancelled}</td></tr>`).join('')}
      </table>
      <div class="stats-sub">מה נמכר ב-4 השבועות האחרונים</div>
      ${soldRows ? `<table class="stats-table">${soldRows}<tr><td>מתוכם במבצע</td><td class="num">${combos}</td></tr></table>` : '<div class="stats-note">עוד אין מכירות בתקופה הזו.</div>'}
      <div class="stats-note">נספרות כל ההזמנות: מהאתר ומהבוט (טלפון, וואטסאפ, אינסטגרם, במקום). שבוע = ראשון עד שבת. הזמנה שבוטלה לא נספרת במכירות.</div>
    </details>
    ${insightsHtml(data.insights)}
    ${monthsHtml(data.months)}
    <div class="backup-row">
      <span id="backupInfo">${backupInfoText(data.lastBackup)}</span>
      <button type="button" onclick="downloadBackup(this)">⬇️ הורדת גיבוי</button>
    </div>`;
  renderBackupAlert(data.lastBackup);
}

const MONTH_NAMES = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DAY_NAMES = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

function isOpen(id){ const el = document.getElementById(id); return !!(el && el.open); }

// שורת עמודה אופקית: תווית, פס יחסי לערך הגבוה ביותר, ומספר
function barRow(label, value, max, text, wide){
  const pct = max ? Math.round(value / max * 100) : 0;
  return `<div class="bar-row ${wide ? 'wide' : ''}"><span class="bar-label">${label}</span><span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span><span class="bar-num">${text}</span></div>`;
}

function insightsHtml(ins){
  if(!ins) return '';
  let body;
  if(!ins.orders){
    body = '<div class="stats-note">עוד אין הזמנות בתקופה הזו.</div>';
  } else {
    const maxDay = Math.max(...ins.byWeekday.map(d => d.orders));
    const hours = ins.byHour.map((n, h) => ({ h, n })).filter(x => x.n > 0);
    const maxHour = Math.max(...hours.map(x => x.n));
    body = `
      <div class="stats-tiles" style="margin-top:8px">
        <div class="stats-tile"><div class="label">הזמנה ממוצעת</div><div class="value">${Math.round(ins.revenue / ins.orders)} ₪</div></div>
        <div class="stats-tile"><div class="label">בורקסים להזמנה</div><div class="value">${(ins.burekas / ins.orders).toFixed(1)}</div></div>
      </div>
      <div class="stats-sub">הזמנות לפי יום בשבוע</div>
      ${ins.byWeekday.map((d, i) => barRow(DAY_NAMES[i], d.orders, maxDay, `${d.orders} · ${d.revenue} ₪`, true)).join('')}
      <div class="stats-sub">הזמנות לפי שעה</div>
      ${hours.map(x => barRow(String(x.h).padStart(2, '0') + ':00', x.n, maxHour, x.n)).join('')}
      <div class="stats-note">${ins.orders} הזמנות ב-${ins.days} הימים האחרונים, בלי מבוטלות. השעה היא השעה שבה ההזמנה נרשמה.</div>`;
  }
  return `<details id="insightsBox" ${isOpen('insightsBox') ? 'open' : ''}><summary>ניתוח ${ins.days} הימים האחרונים</summary>${body}</details>`;
}

function monthsHtml(months){
  if(!months || !months.length) return '';
  const byKey = Object.fromEntries(months.map(m => [m.month, m]));
  const rows = months.map(m => {
    const [y, mo] = m.month.split('-').map(Number);
    const lastYear = byKey[`${y - 1}-${String(mo).padStart(2, '0')}`];
    const cmp = lastYear ? `${lastYear.orders} · ${lastYear.revenue} ₪` : '—';
    return `<tr><td>${MONTH_NAMES[mo - 1]} ${y}</td><td class="num">${m.orders}</td><td class="num">${m.revenue} ₪</td><td class="num">${cmp}</td></tr>`;
  }).join('');
  return `<details id="monthsBox" ${isOpen('monthsBox') ? 'open' : ''}><summary>לפי חודשים, מתחילת הדרך</summary>
    <table class="stats-table">
      <tr><th>חודש</th><th class="num">הזמנות</th><th class="num">מכירות</th><th class="num">אותו חודש אשתקד</th></tr>
      ${rows}
    </table>
    <div class="stats-note">החודש הנוכחי עוד לא הסתיים, ולכן הוא חלקי.</div></details>`;
}

function backupInfoText(last){
  if(!last) return 'עוד לא נעשה גיבוי';
  const when = new Date(last.at).toLocaleString('he-IL', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  return `גיבוי אחרון: ${when} (${last.by === 'auto' ? 'אוטומטי' : 'ידני'})`;
}

function renderBackupAlert(last){
  const el = document.getElementById('backupAlert');
  const days = last ? (Date.now() - new Date(last.at).getTime()) / 864e5 : Infinity;
  if(days <= BACKUP_WARN_DAYS){ el.textContent = ''; return; }
  el.textContent = last
    ? `💾 עברו ${Math.floor(days)} ימים מהגיבוי האחרון. כדאי ללחוץ על "הורדת גיבוי" למטה, ולבדוק שהגיבוי האוטומטי במחשב רץ.`
    : '💾 עוד לא נעשה גיבוי של ההזמנות והמלאי. כדאי ללחוץ על "הורדת גיבוי" למטה.';
}

async function downloadBackup(btn){
  btn.disabled = true;
  try{
    const res = await fetch(API_URL + '/api/admin/backup', { headers: { 'Authorization': 'Bearer ' + getToken() } });
    if(res.status === 401){ logout(); return; }
    if(!res.ok) throw new Error();
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `amka-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    loadStats();
  } catch(e){
    alert('הורדת הגיבוי נכשלה, נסה שוב');
  } finally { btn.disabled = false; }
}

// אם יש טוקן שמור ותקף, כניסה ישירה
if(getToken()){ showDashboard(); }
</script>
